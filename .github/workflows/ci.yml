name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/lorddetson/pipoker-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI --code-coverage

      - name: Build
        run: npx ng build --configuration prod

  serve:
    # Builds the image like the release does and checks what nginx serves, so a broken nginx.conf fails here and not on QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pipoker-web:ci .

      - name: Start nginx
        run: docker run -d --name web -p 8080:80 pipoker-web:ci

      - name: Check that index.html is checked on every load and bundles are cached
        run: |
          header() { curl -sfI --retry 10 --retry-connrefused "http://localhost:8080$1" | tr -d '\r' | grep -i '^cache-control:' ; }
          for page in / /index.html /room/some-room; do
            [ "$(header "$page")" = "Cache-Control: no-cache" ] || { echo "$page: $(header "$page")"; exit 1; }
          done
          bundle=$(curl -sf --retry 10 --retry-connrefused http://localhost:8080/ | grep -o 'main\.[0-9a-f]\{16\}\.js' | head -1)
          [ -n "$bundle" ] || { echo "index.html names no main bundle"; exit 1; }
          [ "$(header "/$bundle")" = "Cache-Control: public, max-age=31536000, immutable" ] || { echo "$bundle: $(header "/$bundle")"; exit 1; }

  image:
    # Images are published only from main, pull requests are just built and tested.
    # The qa tag is picked up by the QA environment on the server (see pipoker-docker-config/server).
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:qa
