events{}
http {
    include /etc/nginx/mime.types;
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
            # index.html names the bundles of the current release, so the browser must check it on every load,
            # otherwise after a release it keeps showing the previous version from its cache
            add_header Cache-Control "no-cache";
        }
        # The build puts a content hash into the bundle names (outputHashing), a new release gets new names
        location ~ "-[0-9A-Z]{8}\.\w+$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
