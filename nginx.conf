events{}
http {
    include /etc/nginx/mime.types;
    # Don't advertise the nginx version in the Server header or on error pages
    server_tokens off;
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        location / {
            # The build prerenders the start page and the guide (index.html, guide/index.html); the other pages
            # start from index.csr.html, where the application renders them. "/guide" is served from its folder
            # without the redirect to "/guide/" a bare "$uri/" would make
            try_files $uri $uri/index.html /index.csr.html;
            # The HTML pages name the bundles of the current release, so the browser must check them on every load,
            # otherwise after a release it keeps showing the previous version from its cache
            add_header Cache-Control "no-cache";
        }
        # Chrome reads the manifest to install the site as an app. nginx's own list of types has no entry for it,
        # and its name has no hash, so the browser checks it on every load like index.html
        location = /manifest.webmanifest {
            types { }
            default_type application/manifest+json;
            add_header Cache-Control "no-cache";
        }
        # The build puts a content hash into the bundle names (outputHashing), a new release gets new names
        location ~ "-[0-9A-Z]{8}\.\w+$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
