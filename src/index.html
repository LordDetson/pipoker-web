<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <!-- Search engines and link previews read the tags below before the app starts, so they are in Russian, the
       language of most visitors. Once the app starts, the page puts its title, description, canonical address and
       language addresses in the visitor's language (PageMetaService, "meta.title" and "meta.description"). -->
  <title>PiPoker — Planning Poker онлайн</title>
  <meta name="description" content="Бесплатный Planning Poker онлайн для scrum-команд: создайте комнату, отправьте ссылку и оценивайте задачи вместе. Без регистрации, на компьютере и телефоне.">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#212529">
  <link rel="canonical" href="https://pipoker.app/">
  <!-- The start page in each language; without one it picks the language by the browser (language-pages.ts) -->
  <link rel="alternate" hreflang="ru" href="https://pipoker.app/ru">
  <link rel="alternate" hreflang="en" href="https://pipoker.app/en">
  <link rel="alternate" hreflang="x-default" href="https://pipoker.app/">
  <link rel="icon" type="image/x-icon" href="assets/pipoker-logo.ico">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <!-- Lets Chrome and Edge install the site as an app in its own window. No service worker: the app needs the server
       anyway, and nothing cached could hold an old release back -->
  <link rel="manifest" href="manifest.webmanifest">

  <!-- The preview shown for a shared link in Telegram, VK, Slack and other messengers; each page puts its own
       title, description, address and language here (PageMetaService) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PiPoker">
  <meta property="og:url" content="https://pipoker.app/">
  <meta property="og:title" content="PiPoker — Planning Poker онлайн">
  <meta property="og:description" content="Бесплатный Planning Poker онлайн для scrum-команд: создайте комнату, отправьте ссылку и оценивайте задачи вместе. Без регистрации, на компьютере и телефоне.">
  <meta property="og:image" content="https://pipoker.app/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="PiPoker — Planning Poker онлайн">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "PiPoker",
      "url": "https://pipoker.app/",
      "description": "Бесплатный Planning Poker онлайн для scrum-команд: создайте комнату, отправьте ссылку и оценивайте задачи вместе.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Any",
      "inLanguage": ["ru", "en"],
      "isAccessibleForFree": true,
      "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"}
    }
  </script>
</head>
<body data-bs-theme="dark" class="common-transition">
<app-root></app-root>
<!-- The pages search engines show are prerendered with their texts (app.routes.server.ts), so this only tells
     a person with JavaScript switched off why nothing works -->
<noscript>
  <p lang="ru">Для работы PiPoker нужен JavaScript.</p>
  <p lang="en">PiPoker needs JavaScript to run.</p>
</noscript>
</body>
</html>
