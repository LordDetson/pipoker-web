<!-- The whole timer is the button that stops it, so it is easy to hit on a phone too -->
<button *ngIf="countdown$ | async as countdown; else idle" type="button" class="timer" (click)="stop()"
        [title]="'timer.stop' | translate"
        [class.warning]="countdown.left > 0 && countdown.left <= warningSeconds" [class.time-up]="countdown.left === 0">
  <span class="time" role="timer">{{countdown.left === 0 ? ("timer.timeUp" | translate) : format(countdown.left)}}</span>
  <svg class="stop" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
    <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <span class="visually-hidden">{{"timer.stop" | translate}}</span>
</button>

<ng-template #idle>
  <div *ngIf="!(revealed$ | async)" ngbDropdown placement="bottom top">
    <button type="button" ngbDropdownToggle class="btn btn-sm timer-toggle" [title]="'timer.startTitle' | translate">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="8" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 9V5.5M6 1.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      {{"timer.start" | translate}}
    </button>
    <div ngbDropdownMenu>
      <button *ngFor="let length of minutes" type="button" ngbDropdownItem (click)="start(length)">
        {{"timer.minutes" | translate: {minutes: length} }}
      </button>
    </div>
  </div>
</ng-template>
