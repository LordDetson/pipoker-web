<div class="start-page">
  <form [formGroup]="joinToRoomForm" (submit)="addParticipant()">
    <div class="form-group mb-3">
      <label for="nicknameInput" class="form-label">{{"form.nickname" | translate}}</label>
      <input type="text"
             class="form-control common-transition"
             id="nicknameInput"
             formControlName="nickname"
             [placeholder]="'form.nicknamePlaceholder' | translate"
             maxlength="32"
             [ngClass]="{'is-invalid': this.joinToRoomForm.controls['nickname'].touched &&
                 this.joinToRoomForm.controls['nickname'].errors,
                 'is-valid': this.joinToRoomForm.controls['nickname'].valid &&
                 this.joinToRoomForm.controls['nickname'].touched}">
      <div class="invalid-feedback">{{nicknameError()}}</div>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input common-transition"
             type="checkbox"
             id="watcherInput"
             formControlName="watcher">
      <label class="form-check-label" for="watcherInput">
        {{"form.watcher" | translate}}
      </label>
    </div>
    <div *ngIf="error$ | async as error" class="alert alert-danger" role="alert">{{error}}</div>
    <div class="d-grid gap-2">
      <button class="btn btn-primary" type="submit" [disabled]="joinToRoomForm.invalid">{{"form.joinRoom" | translate}}</button>
    </div>
  </form>
  <app-about/>
</div>
