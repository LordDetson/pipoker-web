<div class="task" [formGroup]="form">
  <div class="task-field task-name-field" [class.task-empty]="form.disabled && !form.controls.name.value">
    <input #name type="text" class="form-control task-name" formControlName="name" [title]="form.controls.name.value"
           [attr.maxlength]="maxNameLength" [placeholder]="'task.name' | translate" [attr.aria-label]="'task.name' | translate"
           autocomplete="off" enterkeyhint="done"
           (focus)="focused = 'name'" (blur)="leave()" (keydown.enter)="save(); name.blur()"
           (keydown.escape)="revert('name'); name.blur()">
    <!-- mousedown would take the cursor out of the field before the click -->
    <button *ngIf="focused === 'name' && form.controls.name.value" type="button" class="task-clear"
            [title]="'task.clear' | translate" [attr.aria-label]="'task.clear' | translate"
            (mousedown)="$event.preventDefault()" (click)="clear('name')">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
        <path d="M2 2l8 8M10 2l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <div class="task-field task-url-field" [class.task-empty]="form.disabled && !form.controls.url.value">
    <input #url type="url" class="form-control task-url" formControlName="url" [title]="form.controls.url.value"
           [class.is-invalid]="form.controls.url.invalid"
           [attr.maxlength]="maxUrlLength" [placeholder]="'task.url' | translate" [attr.aria-label]="'task.url' | translate"
           autocomplete="off" enterkeyhint="done"
           (focus)="focused = 'url'" (blur)="leave()" (keydown.enter)="save(); url.blur()"
           (keydown.escape)="revert('url'); url.blur()">
    <button *ngIf="focused === 'url' && form.controls.url.value" type="button" class="task-clear"
            [title]="'task.clear' | translate" [attr.aria-label]="'task.clear' | translate"
            (mousedown)="$event.preventDefault()" (click)="clear('url')">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
        <path d="M2 2l8 8M10 2l-8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <a *ngIf="link && focused !== 'url'" class="task-open" [href]="link" target="_blank" rel="noopener noreferrer"
       [title]="'task.open' | translate" [attr.aria-label]="'task.open' | translate">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M9 2.5h4.5V7M13.5 2.5L7 9M11.5 9.5v4h-9v-9h4" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
  </div>
  <div *ngIf="form.controls.url.invalid" class="task-error text-danger">{{"task.urlInvalid" | translate}}</div>
  <div *ngIf="error" class="task-error text-danger" role="alert">{{error | serverError}}</div>
</div>
