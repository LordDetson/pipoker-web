<div *ngIf="gone$ | async as gone; else present" class="container-fluid d-flex flex-column align-items-center py-5">
  <div class="col-10 col-md-8 col-lg-6 text-center">
    <ng-container *ngIf="gone === RoomStatus.closed; else missing">
      <h2 class="mb-3">{{"room.closedTitle" | translate}}</h2>
      <p class="text-body-secondary">{{"room.closedText" | translate}}</p>
    </ng-container>
    <ng-template #missing>
      <h2 class="mb-3">{{"room.missingTitle" | translate}}</h2>
      <p class="text-body-secondary">{{"room.missingText" | translate}}</p>
    </ng-template>
    <!-- A new page load starts the next room with a clean state -->
    <a class="btn btn-primary mt-3" href="/">{{"room.createNew" | translate}}</a>
  </div>
</div>
<ng-template #present>
  <div *ngIf="returning$ | async; else seat" class="d-flex justify-content-center mt-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">{{"room.returning" | translate}}</span>
    </div>
  </div>
  <ng-template #seat>
    <ng-container *ngIf="!(joined$ | async); else room">
      <app-add-participant [joinRightAway]="joinRightAway"/>
    </ng-container>
  </ng-template>
  <ng-template #room>
    <app-role-switch/>
    <app-history/>
    <app-task/>
    <app-table>
      <div class="table-controls">
        <!-- The timer runs while people vote, the estimate is accepted after the cards are revealed -->
        <app-timer/>
        <app-estimate/>
        <app-buttons/>
      </div>
    </app-table>
    <!-- The result takes the place of the deck, which keeps its size so the table does not jump when the cards are revealed.
         A watcher has no deck, so their table takes the whole height until the result comes. -->
    <div *ngIf="!(watcher$ | async) || (showVotingResult$ | async)" class="hand">
      <app-deck [class.invisible]="showVotingResult$ | async"/>
      <app-voting-result *ngIf="showVotingResult$ | async"/>
    </div>
  </ng-template>
</ng-template>
