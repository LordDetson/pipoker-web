<div *ngIf="returning$ | async; else seat" class="d-flex justify-content-center mt-5">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">{{"room.returning" | translate}}</span>
  </div>
</div>
<ng-template #seat>
  <ng-container *ngIf="!(joined$ | async); else room">
    <app-add-participant/>
  </ng-container>
</ng-template>
<ng-template #room>
  <app-buttons/>
  <app-table/>
  <ng-container *ngIf="!(showVotingResult$ | async); else chart">
    <app-deck/>
  </ng-container>
  <ng-template #chart>
    <app-voting-result-chart/>
  </ng-template>
</ng-template>
