<button id="mainBtn" type="button"
        class="btn btn-lg common-transition"
        [ngClass]="{
          'btn-secondary': !(voted$ | async),
          'btn-primary' : voted$ | async
        }"
        [disabled]="!(voted$ | async)"
        (click)="mainBtnClick()">
  {{(!(voted$ | async) ? 'room.voting' : !(showVotingResult$ | async) ? 'room.revealCards' : 'room.startNewVoting') | translate}}
</button>
