<div class="form-check form-switch m-0" [title]="'room.watcherSwitchTitle' | translate">
  <input class="form-check-input" type="checkbox" role="switch" id="watcherSwitch"
         [checked]="watcher$ | async" (click)="toggle($event)">
  <label class="form-check-label" for="watcherSwitch">{{"room.watcherSwitch" | translate}}</label>
</div>
<!-- On a phone the task shares the line with the switch, so a button with the eye the watchers are marked with stands in
     for it: grey for a voter, blue for a watcher -->
<button type="button" class="btn role-button" [class.watching]="watcher$ | async" [attr.aria-pressed]="watcher$ | async"
        [title]="'room.watcherSwitchTitle' | translate" [attr.aria-label]="'room.watcherSwitch' | translate"
        (click)="toggle($event)">
  <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 5C8.24 5 5.44 7.44 3.77 9.44a3.88 3.88 0 000 5.12C5.44 16.56 8.24 19 12 19s6.56-2.44 8.23-4.44a3.88 3.88 0 000-5.12C18.56 7.44 15.76 5 12 5z"
          fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
  </svg>
</button>
