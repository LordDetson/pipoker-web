<div class="modal-header">
  <h2 id="bugReportTitle" class="modal-title h5">{{"bugReport.title" | translate}}</h2>
  <button type="button" class="btn-close" [attr.aria-label]="'bugReport.close' | translate"
          (click)="activeModal.dismiss()"></button>
</div>
<ng-container *ngIf="!sent; else thanks">
  <form [formGroup]="form" (submit)="send()">
    <div class="modal-body">
      <div class="mb-3">
        <label for="bugReportMessage" class="form-label">{{"bugReport.message" | translate}}</label>
        <textarea id="bugReportMessage" class="form-control" rows="5" formControlName="message" ngbAutofocus
                  [maxlength]="messageMaxLength" [placeholder]="'bugReport.messagePlaceholder' | translate"
                  [class.is-invalid]="form.controls.message.touched && form.controls.message.invalid"></textarea>
        <div class="invalid-feedback">{{"bugReport.messageRequired" | translate}}</div>
      </div>
      <div class="mb-3">
        <label for="bugReportContact" class="form-label">{{"bugReport.contact" | translate}}</label>
        <input id="bugReportContact" type="text" class="form-control" formControlName="contact"
               [maxlength]="contactMaxLength" [placeholder]="'bugReport.contactPlaceholder' | translate">
      </div>
      <p class="form-text m-0">{{"bugReport.details" | translate}}</p>
      <div *ngIf="error" class="alert alert-danger mt-3 mb-0" role="alert">{{error | translate}}</div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline-secondary" (click)="activeModal.dismiss()">
        {{"bugReport.cancel" | translate}}
      </button>
      <button type="submit" class="btn btn-primary d-flex align-items-center gap-2" [disabled]="sending">
        <span *ngIf="sending" class="spinner-border spinner-border-sm" aria-hidden="true"></span>
        {{"bugReport.send" | translate}}
      </button>
    </div>
  </form>
</ng-container>
<ng-template #thanks>
  <div class="modal-body">
    <p class="m-0" role="status">{{"bugReport.sent" | translate}}</p>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-primary" ngbAutofocus (click)="activeModal.close()">
      {{"bugReport.close" | translate}}
    </button>
  </div>
</ng-template>
