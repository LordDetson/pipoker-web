<header class="header-grid align-items-center h-100 px-3 py-2 shadow-sm common-transition">
  <a class="d-flex align-items-center justify-content-center justify-content-lg-start link-body-emphasis text-decoration-none" href="/">
    <img src="/assets/svg/pipoker-logo.svg"
         width="55"
         height="55"
         class="me-3"
         alt="PiPoker Logo">
    <span class="d-flex flex-column">
      <strong class="fs-1 lh-1">PiPoker</strong>
      <small class="tagline text-body-secondary">{{"header.tagline" | translate}}</small>
    </span>
  </a>
  <strong *ngIf="roomName$ | async as roomName" class="text-center text-truncate fs-3">{{roomName}}</strong>
  <div class="buttons d-flex flex-wrap justify-content-center justify-content-lg-end align-items-center gap-3">
    <button *ngIf="roomId$ | async as roomId" type="button" class="btn common-transition d-flex align-items-center invitation-link"
            [ngClass]="{
              'btn-primary': !copied,
              'btn-success': copied,
              'not-copied': !copied,
              'copied': copied
            }"
            [title]="'header.copyInvitationLink' | translate" (click)="copyInvitationLink(roomId)">
      <span class="add-user-icon common-transition"></span>
      {{"header.invite" | translate}}
    </button>
    <a *ngIf="supportUrl" class="btn common-transition d-flex align-items-center support-link"
       [href]="supportUrl" target="_blank" rel="noopener" [title]="'header.supportTitle' | translate">
      <span class="heart-icon me-1" aria-hidden="true">&#9829;</span>
      {{"header.support" | translate}}
    </a>
    <div ngbDropdown placement="bottom-end" class="language-select">
      <button type="button" ngbDropdownToggle class="btn btn-outline-secondary common-transition d-flex align-items-center"
              [attr.aria-label]="'header.language' | translate" [title]="'header.language' | translate">
        <img [src]="i18n.current.flag" width="24" height="16" class="flag me-2" alt="">
        {{i18n.current.short}}
      </button>
      <div ngbDropdownMenu>
        <button *ngFor="let language of languages" type="button" ngbDropdownItem
                class="d-flex align-items-center" [class.active]="language.code === i18n.language"
                [attr.lang]="language.code" (click)="i18n.choose(language.code)">
          <img [src]="language.flag" width="24" height="16" class="flag me-2" alt="">
          {{language.name}}
        </button>
      </div>
    </div>
    <app-theme-switcher/>
  </div>
</header>
