<div class="container-fluid d-flex flex-column align-items-center py-5">
  <form [formGroup]="createRoomForm" (submit)="createRoom()"
        class="col-10 col-md-8 col-lg-6">
    <div class="form-group mb-3">
      <label for="nicknameInput" class="form-label">{{"form.nickname" | translate}}</label>
      <input type="text"
             class="form-control common-transition"
             id="nicknameInput"
             formControlName="nickname"
             [placeholder]="'form.nicknamePlaceholder' | translate"
             maxlength="32"
             [ngClass]="{'is-invalid': this.createRoomForm.controls['nickname'].touched &&
                 this.createRoomForm.controls['nickname'].errors,
                 'is-valid': this.createRoomForm.controls['nickname'].valid &&
                 this.createRoomForm.controls['nickname'].touched}">
      <div class="invalid-feedback">{{errorMessage("nickname", "validation.nickname")}}</div>
    </div>
    <div class="form-group mb-3">
      <label for="roomNameInput" class="form-label">{{"form.roomName" | translate}}</label>
      <input type="text"
             class="form-control common-transition"
             id="roomNameInput"
             formControlName="roomName"
             [placeholder]="'form.roomNamePlaceholder' | translate"
             maxlength="32"
             [ngClass]="{'is-invalid': this.createRoomForm.controls['roomName'].touched &&
                 this.createRoomForm.controls['roomName'].errors,
                 'is-valid': this.createRoomForm.controls['roomName'].valid &&
                 this.createRoomForm.controls['roomName'].touched}">
      <div class="invalid-feedback">{{errorMessage("roomName", "validation.roomName")}}</div>
    </div>
    <div class="form-group mb-3">
      <label for="deckSelect" class="form-label">{{"form.deck" | translate}}</label>
      <div class="input-group mb-2">
        <select class="form-select common-transition"
                id="deckSelect"
                #deckSelect
                (change)="pickDeck(deckSelect.value, deckInput)">
          <optgroup [label]="'deck.presets' | translate">
            <option *ngFor="let deck of presetDecks"
                    [value]="'preset:' + deck.id"
                    [selected]="selectedDeck === 'preset:' + deck.id">{{deck.name | translate}}</option>
          </optgroup>
          <optgroup *ngIf="myDecks.length > 0" [label]="'deck.mine' | translate">
            <option *ngFor="let deck of myDecks"
                    [value]="'mine:' + deck.name"
                    [selected]="selectedDeck === 'mine:' + deck.name">{{deck.name}}</option>
          </optgroup>
          <option value="" [selected]="selectedDeck === ''">{{"deck.own" | translate}}</option>
        </select>
        <button *ngIf="selectedDeck.startsWith('mine:')"
                id="deleteDeckButton"
                class="btn btn-outline-danger"
                type="button"
                [title]="'deck.deleteTitle' | translate"
                (click)="deleteDeck()">{{"deck.delete" | translate}}</button>
      </div>
      <input type="text"
             class="form-control common-transition"
             id="deckInput"
             #deckInput
             formControlName="deck"
             aria-labelledby="deckHelp"
             [placeholder]="'form.deckPlaceholder' | translate"
             maxlength="158"
             [ngClass]="{'is-invalid': this.createRoomForm.controls['deck'].touched &&
                 this.createRoomForm.controls['deck'].errors,
                 'is-valid': this.createRoomForm.controls['deck'].valid &&
                 this.createRoomForm.controls['deck'].touched}">
      <div class="invalid-feedback">{{errorMessage("deck", "validation.deck")}}</div>
      <div *ngIf="canSaveDeck" class="input-group mt-2">
        <input type="text"
               class="form-control common-transition"
               id="deckNameInput"
               #deckNameInput
               [value]="deckName"
               (input)="deckName = deckNameInput.value"
               [placeholder]="'deck.namePlaceholder' | translate"
               [attr.aria-label]="'deck.namePlaceholder' | translate"
               maxlength="32"
               (keydown.enter)="$event.preventDefault(); saveDeck()">
        <button id="saveDeckButton"
                class="btn btn-outline-secondary"
                type="button"
                [disabled]="deckName.trim() === ''"
                (click)="saveDeck()">{{"deck.save" | translate}}</button>
      </div>
      <div id="deckHelp" class="form-text common-transition">
        {{"form.deckHelp" | translate}}
      </div>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input common-transition"
             type="checkbox"
             id="watcherInput"
             formControlName="watcher">
      <label class="form-check-label" for="watcherInput">
        {{"form.watcher" | translate}}
      </label>
    </div>
    <div *ngIf="error$ | async as error" class="alert alert-danger" role="alert">{{error}}</div>
    <div class="d-grid gap-2">
      <button class="btn btn-primary" type="submit" [disabled]="createRoomForm.invalid">{{"form.createRoom" | translate}}</button>
    </div>
  </form>
  <app-about class="col-10 col-md-8 col-lg-6 mt-5"/>
</div>
